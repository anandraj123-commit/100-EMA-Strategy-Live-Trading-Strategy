# TESTING deployment blueprint. Railway Production supplies APP_MODE=production separately.
services:
  - type: web
    name: trading-platform
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: RESOLUTION
        value: 5m
      - key: POLL_MS
        value: 1000
      - key: APP_MODE
        value: testing
      - key: MONGODB_URI_TESTING
        sync: false
      - key: MONGODB_DB_TESTING
        sync: false
      - key: AUTH_SECRET_TESTING
        sync: false
      - key: DELTA_API_KEY_TESTING
        sync: false
      - key: DELTA_API_SECRET_TESTING
        sync: false
