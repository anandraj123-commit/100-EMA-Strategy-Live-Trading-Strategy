name: Validate main

on:
  pull_request:
    branches:
      - main

  # Run validation whenever ANY branch is pushed.
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete validation
        env:
          RESOLUTION: 5m
        run: npm run validate