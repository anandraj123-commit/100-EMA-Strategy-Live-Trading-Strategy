name: Validate main

on:
  pull_request:
    branches:
      - main

  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete validation
        env:
          APP_MODE: development
          RESOLUTION: 5m
          MONGODB_URI_DEVELOPMENT: ${{ secrets.MONGODB_URI_DEVELOPMENT }}
        run: npm run validate